[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bloxorz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gymnasium",
    "pygame",
]

[project.optional-dependencies]
# The JAX port in bloxorz.jx; the NumPy env and the pygame game need none of it.
jax = ["jax>=0.4.30"]
dev = ["jax>=0.4.30", "pytest>=7", "pillow"]

[project.scripts]
bloxorz = "bloxorz.core:main"

[tool.setuptools]
packages = ["bloxorz", "bloxorz.jx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
